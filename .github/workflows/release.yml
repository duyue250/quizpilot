name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包 zip（仓库快照）
        run: zip -r quizpilot-${{ github.ref_name }}.zip . -x ".git/*"
      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: quizpilot-${{ github.ref_name }}.zip
